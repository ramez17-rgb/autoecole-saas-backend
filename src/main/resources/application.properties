
spring.datasource.url=jdbc:postgresql://localhost:5432/autoecole
spring.datasource.username=autoecole_user
spring.datasource.password=autoecole_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# for token creation
jwt.secret=CHANGE_ME_SUPER_SECRET_KEY_123456789
jwt.expiration=86400000


# Mail Configuration (Dummy)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=user
spring.mail.password=pass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
