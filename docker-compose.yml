version: "3.9"

services:
  db:
    image: postgres:15
    container_name: autoecole_db
    environment:
      POSTGRES_DB: autoecole
      POSTGRES_USER: autoecole_user
      POSTGRES_PASSWORD: autoecole_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: